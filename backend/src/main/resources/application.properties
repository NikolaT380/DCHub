spring.application.name=dchub

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dchub
spring.datasource.username=dchub_user
spring.datasource.password=dchub_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT (override via env in Docker)
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production}
jwt.expiration.ms=86400000

# Storage
app.storage.path=./storage

# CORS
app.cors.allowed-origins=http://localhost:5173
